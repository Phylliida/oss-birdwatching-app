<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Birds</title>
    <script>
      // Apply the saved (or OS-preferred) theme before first paint to avoid a flash.
      (function () {
        try {
          var t = localStorage.getItem("theme") ||
            (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
          document.documentElement.setAttribute("data-theme", t);
        } catch (e) {}
      })();
    </script>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header id="topbar">
      <nav id="nav">
        <a href="/" class="back-home">← Living things</a>
        <a href="#/aves">All birds</a>
        <a href="#/nearby">Near me</a>
        <a href="#/about">About</a>
        <div class="search-wrap">
          <input id="search-input" type="search" placeholder="Search birds…" autocomplete="off" spellcheck="false" />
          <div id="search-results" hidden></div>
        </div>
        <button id="theme-toggle" class="theme-toggle" type="button" aria-label="Toggle dark mode">☾</button>
      </nav>
      <div id="crumbs"></div>
    </header>
    <main id="view">Loading…</main>
    <script src="app.js"></script>
  </body>
</html>
