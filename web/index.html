<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Living Things</title>
    <script>
      // Apply saved/OS theme before paint (no flash).
      (function () {
        try {
          var t = localStorage.getItem("theme") ||
            (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
          document.documentElement.setAttribute("data-theme", t);
        } catch (e) {}
      })();
    </script>
    <style>
      :root {
        --bg: #faf7f1;
        --fg: #1c1a17;
        --muted: #6b6359;
        --accent: #6b4f1d;
        --card: #ffffff;
        --border: #e6dfd2;
      }
      :root[data-theme="dark"] {
        --bg: #15120e; --fg: #e9e2d4; --muted: #9d9381;
        --accent: #d8b87a; --card: #211c15; --border: #38302a;
      }
      :root[data-theme="dark"] .card .thumb { background-color: #2a251d; }
      .theme-toggle {
        margin-left: auto; flex: none; background: none;
        border: 1px solid var(--border); border-radius: 999px; color: var(--muted);
        cursor: pointer; font-size: 15px; line-height: 1; padding: 5px 9px;
      }
      .theme-toggle:hover { color: var(--fg); border-color: var(--accent); }
      * { box-sizing: border-box; }
      html, body { margin: 0; padding: 0; }
      body {
        background: var(--bg);
        color: var(--fg);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        font-size: 16px;
        line-height: 1.5;
      }
      a { color: var(--accent); text-decoration: none; }
      a:hover { text-decoration: underline; }

      header#topbar {
        position: sticky;
        top: 0;
        background: var(--bg);
        border-bottom: 1px solid var(--border);
        z-index: 10;
      }
      #nav {
        display: flex;
        align-items: center;
        gap: 18px;
        padding: 10px 20px 8px;
        font-size: 14px;
        font-weight: 600;
        border-bottom: 1px solid var(--border);
      }
      #nav .home { color: var(--accent); }
      #crumbs {
        padding: 10px 20px;
        font-size: 14px;
        color: var(--muted);
      }
      #crumbs a { color: var(--muted); }
      #crumbs .sep { margin: 0 6px; opacity: 0.5; }
      #crumbs .here { color: var(--fg); font-weight: 600; }

      main#view {
        max-width: 1100px;
        margin: 0 auto;
        padding: 24px 20px 80px;
      }

      .title-block { margin-bottom: 24px; }
      .title-block .rank {
        font-size: 12px;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: var(--muted);
      }
      .title-block h1 { margin: 4px 0 4px; font-size: 32px; font-weight: 700; }
      .title-block .meta { color: var(--muted); font-size: 14px; }
      .title-block .clade-wiki { margin: 8px 0 0; font-size: 14px; font-weight: 600; }
      .title-block .clade-wiki a { color: var(--accent); }

      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
        gap: 14px;
      }
      .card {
        display: block;
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 8px;
        overflow: hidden;
        color: inherit;
        text-decoration: none;
        transition: transform 0.12s ease, box-shadow 0.12s ease;
      }
      .card:hover {
        transform: translateY(-1px);
        box-shadow: 0 4px 14px rgba(0, 0, 0, 0.08);
        text-decoration: none;
      }
      .card .thumb {
        aspect-ratio: 1 / 1;
        background-color: #eee9dc;
        background-size: contain;
        background-repeat: no-repeat;
        background-position: center;
      }
      .card .thumb.placeholder {
        display: flex;
        align-items: center;
        justify-content: center;
        color: var(--muted);
        font-size: 12px;
      }
      .card .info { padding: 8px 10px; }
      .card .info .name { font-weight: 600; font-size: 14px; line-height: 1.3; }
      .card .info .sub { font-size: 12px; color: var(--muted); margin-top: 2px; }
    </style>
  </head>
  <body>
    <header id="topbar">
      <nav id="nav">
        <a href="/" class="home">Living things</a>
        <button id="theme-toggle" class="theme-toggle" type="button" aria-label="Toggle dark mode">☾</button>
      </nav>
      <div id="crumbs"></div>
    </header>
    <main id="view">Loading…</main>

    <script>
      // Hierarchy. Branch nodes have `children` (ids). Leaf nodes have `app`
      // pointing at an entry in landing.json (which gives image + count).
      const VIEWS = {
        "": {
          rank: "All living things",
          title: "Living Things",
          meta: "Browse the tree of life. Open-source, offline, non-commercial.",
          parent: null,
          children: [
            { id: "animalia",  name: "Animalia",  sub: "Animals — browse the whole kingdom",
              href: "/animalia/", imageFromApp: "aves", speciesCount: null },
            { id: "plantae",   name: "Plantae",   sub: "Plants — browse the whole kingdom",
              href: "/plantae/", imageFromApp: "pinopsida", speciesCount: null },
          ],
        },
        animalia: {
          rank: "Kingdom",
          title: "Animalia",
          meta: "Animals.",
          parent: "",
          children: [
            { app: "aves", name: "Birds", sub: "Aves" },
          ],
        },
        plantae: {
          rank: "Kingdom",
          title: "Plantae",
          meta: "Plants.",
          parent: "",
          children: [
            { id: "plantae/gymnosperms", name: "Gymnosperms", sub: "Non-flowering seed plants",
              imageFromApp: "pinopsida", speciesCount: null },
            { id: "plantae/angiosperms", name: "Angiosperms", sub: "Flowering plants",
              imageFromApp: "magnoliaceae", speciesCount: null },
          ],
        },
        "plantae/gymnosperms": {
          rank: "Group",
          title: "Gymnosperms",
          meta: "Non-flowering seed plants — conifers, cycads, ginkgo, gnetales.",
          parent: "plantae",
          children: [
            { app: "pinopsida",    name: "Conifers",  sub: "9 families" },
            { app: "cycadopsida",  name: "Cycads",    sub: "Cycadopsida" },
            { app: "ginkgoopsida", name: "Ginkgo",    sub: "Ginkgoopsida" },
            { app: "gnetopsida",   name: "Gnetales",  sub: "Gnetopsida" },
          ],
        },
        "plantae/angiosperms": {
          rank: "Group",
          title: "Angiosperms",
          meta: "Flowering plants.",
          parent: "plantae",
          children: [
            { app: "magnoliaceae", name: "Magnolias",          sub: "Magnoliaceae" },
            { app: "lauraceae",    name: "Laurels",            sub: "Lauraceae" },
            { app: "arecaceae",    name: "Palms",              sub: "Arecaceae" },
            { app: "quercus",      name: "Oaks",               sub: "Quercus" },
            { app: "betulaceae",   name: "Birches & relatives",sub: "Betulaceae" },
            { app: "acer",         name: "Maples",             sub: "Acer" },
            { app: "salicaceae",   name: "Willows & poplars",  sub: "Salicaceae" },
            { app: "ficus",        name: "Figs",               sub: "Ficus" },
            { app: "acacia",       name: "Acacias",            sub: "Acacia" },
            { app: "rosaceae",     name: "Rose family",        sub: "Rosaceae" },
            { app: "myrtaceae",    name: "Myrtle family",      sub: "Myrtaceae" },
            { app: "eucalyptus",   name: "Eucalypts",          sub: "Eucalyptus" },
          ],
        },
      };

      // ?width=320 thumb URL works for Wikimedia Commons FilePath URLs; iNat
      // S3 ignores it harmlessly.
      function thumbUrl(url) {
        if (!url) return null;
        return url.replace(/^http:\/\//, "https://") + "?width=320";
      }

      let LANDING = {};

      function render() {
        const id = location.hash.replace(/^#\/?/, "").trim();
        const view = VIEWS[id] || VIEWS[""];
        const viewId = id in VIEWS ? id : "";

        // Breadcrumb chain by walking parent links.
        const chain = [];
        let cur = view, curId = viewId;
        while (cur) {
          chain.unshift({ id: curId, title: cur.title });
          if (cur.parent == null) break;
          curId = cur.parent;
          cur = VIEWS[curId];
        }
        const crumbs = chain.map((c, i) => {
          const isLast = i === chain.length - 1;
          if (isLast) return `<span class="here">${c.title}</span>`;
          return `<a href="#/${c.id}">${c.title}</a>`;
        }).join('<span class="sep">›</span>');
        document.getElementById("crumbs").innerHTML = crumbs;

        const cards = view.children.map((c) => {
          const isLeaf = !!c.app;
          let href, img, sub, count;
          if (isLeaf) {
            const meta = LANDING[c.app];
            if (!meta) return "";
            href = meta.href;
            img = meta.image;
            sub = c.sub;
            count = `${meta.speciesCount.toLocaleString()} species`;
          } else {
            // A child may link straight into a sub-app (c.href, e.g. the unified
            // /plantae/ tree) rather than another landing view.
            href = c.href || `#/${c.id}`;
            // Branch nodes (Animalia, Plantae, Gymnosperms, Angiosperms) show
            // their OWN Wikipedia lead photo; fall back to a descendant app's.
            const wk = c.id.split("/").pop();
            img = LANDING._higher?.[wk]?.image
              || (c.imageFromApp ? LANDING[c.imageFromApp]?.image : null);
            sub = c.sub;
            count = LANDING[c.id]?.speciesCount
              ? `${LANDING[c.id].speciesCount.toLocaleString()} species`
              : "";
          }
          const thumb = img
            ? `<div class="thumb" style="background-image:url('${thumbUrl(img)}')"></div>`
            : `<div class="thumb placeholder">no photo</div>`;
          return `<a class="card" href="${href}">
            ${thumb}
            <div class="info">
              <div class="name">${c.name}</div>
              <div class="sub">${sub}${count ? ` · ${count}` : ""}</div>
            </div>
          </a>`;
        }).join("");

        const viewWiki = LANDING._higher?.[viewId.split("/").pop()]?.wikiUrl;
        const wikiLink = viewWiki
          ? `<p class="clade-wiki"><a href="${viewWiki}" target="_blank" rel="noopener">See Wikipedia article →</a></p>`
          : "";
        document.getElementById("view").innerHTML = `
          <div class="title-block">
            <div class="rank">${view.rank}</div>
            <h1>${view.title}</h1>
            <div class="meta">${view.meta}</div>
            ${wikiLink}
          </div>
          <div class="grid">${cards}</div>
        `;
        window.scrollTo(0, 0);
      }

      window.addEventListener("hashchange", render);
      (function wireThemeToggle() {
        var btn = document.getElementById("theme-toggle");
        if (!btn) return;
        function apply(t) {
          document.documentElement.setAttribute("data-theme", t);
          try { localStorage.setItem("theme", t); } catch (e) {}
          btn.textContent = t === "dark" ? "☀" : "☾";
          btn.title = t === "dark" ? "Switch to light mode" : "Switch to dark mode";
        }
        apply(document.documentElement.getAttribute("data-theme") || "light");
        btn.addEventListener("click", function () {
          apply(document.documentElement.getAttribute("data-theme") === "dark" ? "light" : "dark");
        });
      })();
      (async () => {
        try {
          const res = await fetch("/landing.json");
          LANDING = await res.json();
        } catch (e) { console.warn("Failed to load landing.json", e); }
        render();
      })();
    </script>
  </body>
</html>
